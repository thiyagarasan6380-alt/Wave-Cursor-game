<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>NEON WAVE // Cyberpunk Wave Dash</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#05000f; touch-action:none; user-select:none; }
  canvas { display:block; width:100vw; height:100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const H = 600, TILE = 2400, L = 26000, STEP = 4, N = L / STEP + 1;
const SPEED0 = 290;   // base speed: lower = slower, easier
const WAVE = 0.6;   // wave size: 1 = original, smaller = tinier
const GAP_START = 340, GAP_END = 135;   // corridor gap: wide at the start, shrinks as the level goes on
const FONT = '900 {S}px Orbitron, "Courier New", monospace';
const PAL = ["#00f0ff", "#ff2bd6", "#ffe14d"];
let W, S, DPR, layers = [], sunC, scanC, vigC;

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const font = s => FONT.replace("{S}", s);

// ---------- Level generation (same every attempt) ----------
const cen = new Float32Array(N), gp = new Float32Array(N), obs = [];
(function gen() {
  const r = mulberry32(77); let y = H / 2, slope = 0, rem = 0;
  for (let i = 0; i < N; i++) {
    const x = i * STEP, t = x / L;
    const g = GAP_START + (GAP_END - GAP_START) * t + Math.sin(x / 420) * 10 + (x > L - 500 ? (x - (L - 500)) / 500 * 60 : 0);
    gp[i] = g;
    if (x < 1000 || x > L - 500) { slope = 0; rem = 0; }
    else if (rem <= 0) { slope = [-1, -1, 0, 1, 1][Math.floor(r() * 5)]; rem = 100 + r() * 320; }
    rem -= STEP; y += slope * STEP;
    const lo = g / 2 + 36, hi = H - g / 2 - 36;
    if (y < lo) { y = lo; slope = 1; } if (y > hi) { y = hi; slope = -1; }
    cen[i] = y;
  }
  for (let x = 2400; x < L - 1200; x += 520 + r() * 520) obs.push({ x, w: 28, top: r() < 0.5 });
})();
function at(a, x) { const f = x / STEP, i = Math.max(0, Math.min(N - 2, Math.floor(f))), u = f - i; return a[i] * (1 - u) + a[i + 1] * u; }
const ceilY = x => at(cen, x) - at(gp, x) / 2, floorY = x => at(cen, x) + at(gp, x) / 2;
obs.forEach(o => { o.h = at(gp, o.x) * 0.36; });

// ---------- Pre-rendered visuals ----------
function mkLayer(seed, minH, maxH, col, near, k) {
  const c = document.createElement("canvas"); c.width = TILE * k; c.height = H * k;
  const g = c.getContext("2d"); g.scale(k, k);
  const r = mulberry32(seed); let x = 0;
  while (x < TILE) {
    const bw = 45 + r() * 70, bh = minH + r() * (maxH - minH), top = H - bh;
    g.fillStyle = col; g.fillRect(x, top, bw, bh);
    for (let wy = top + 10; wy < H - 10; wy += 13) for (let wx = x + 6; wx < x + bw - 8; wx += 10)
      if (r() < (near ? .22 : .14)) { g.fillStyle = PAL[Math.floor(r() * 3)]; g.globalAlpha = .5 + r() * .45; g.fillRect(wx, wy, 4, 6); }
    g.globalAlpha = 1;
    if (near) {
      const c1 = PAL[Math.floor(r() * 3)];
      g.strokeStyle = c1; g.shadowColor = c1; g.shadowBlur = 12; g.lineWidth = 2;
      g.beginPath(); g.moveTo(x, top); g.lineTo(x + bw, top); g.stroke();
      if (r() < .3) { g.fillStyle = PAL[Math.floor(r() * 3)]; g.shadowColor = g.fillStyle; g.fillRect(x + bw - 14, top + 24, 9, 70); }
      if (r() < .25) { g.fillStyle = "#ff2bd6"; g.shadowColor = "#ff2bd6"; g.fillRect(x + bw / 2 - 1, top - 30, 2, 30); }
      g.shadowBlur = 0;
    }
    x += bw + (near ? 8 + r() * 30 : 4 + r() * 18);
  }
  return c;
}
function buildAssets() {
  const k = Math.min(S, 1.5);
  layers = [mkLayer(11, 150, 330, "#170842", false, k), mkLayer(22, 200, 430, "#0a0220", true, k)];
  sunC = document.createElement("canvas"); sunC.width = sunC.height = 340;
  let g = sunC.getContext("2d"), gr = g.createLinearGradient(0, 20, 0, 320);
  gr.addColorStop(0, "#ffe14d"); gr.addColorStop(.5, "#ff7a2b"); gr.addColorStop(1, "#ff2bd6");
  g.fillStyle = gr; g.beginPath(); g.arc(170, 170, 150, 0, 7); g.fill();
  g.globalCompositeOperation = "destination-out";
  for (let i = 0; i < 8; i++) g.fillRect(0, 175 + i * 18, 340, 3 + i * 1.6);
  scanC = document.createElement("canvas"); scanC.width = 4; scanC.height = 4;
  g = scanC.getContext("2d"); g.fillStyle = "rgba(0,0,0,.22)"; g.fillRect(0, 0, 4, 1.5);
  vigC = document.createElement("canvas"); vigC.width = 256; vigC.height = 256;
  g = vigC.getContext("2d"); gr = g.createRadialGradient(128, 128, 60, 128, 128, 180);
  gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,.75)"); g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
}
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * DPR; cv.height = innerHeight * DPR;
  S = cv.height / H; W = cv.width / S; buildAssets();
}
addEventListener("resize", resize); resize();

// ---------- Audio ----------
let ac, master, muted = false, nextT = 0, step = 0, noiseBuf;
function audioInit() {
  if (ac) { ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .28; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * .3, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextT = ac.currentTime + .1; setInterval(scheduler, 25);
  } catch (e) {}
}
function tone(f, t, dur, type, vol, cut) {
  const o = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter();
  o.type = type; o.frequency.value = f; fl.type = "lowpass"; fl.frequency.value = cut;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
}
function noise(t, dur, vol, hp) {
  const s = ac.createBufferSource(), g = ac.createGain(), fl = ac.createBiquadFilter();
  s.buffer = noiseBuf; fl.type = "highpass"; fl.frequency.value = hp;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
function scheduler() {
  if (!ac || muted) { if (ac) nextT = Math.max(nextT, ac.currentTime); return; }
  const sl = 60 / 140 / 4, roots = [55, 43.65, 65.41, 49], ratio = [1, 1.189, 1.498, 2, 1.498, 1.189, 1, 1.189];
  while (nextT < ac.currentTime + .15) {
    const s = step % 16, bar = Math.floor(step / 16) % 4, root = roots[bar];
    if (s % 4 === 0) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, nextT); o.frequency.exponentialRampToValueAtTime(40, nextT + .12);
      g.gain.setValueAtTime(.9, nextT); g.gain.exponentialRampToValueAtTime(.001, nextT + .2); o.connect(g); g.connect(master); o.start(nextT); o.stop(nextT + .25); }
    if (s % 2 === 1) noise(nextT, .04, .12, 7000);
    if ([0, 2, 3, 5, 7, 10, 11, 13].includes(s)) tone(root, nextT, sl * 1.6, "sawtooth", .5, 400);
    tone(root * 4 * ratio[s % 8], nextT, sl * .9, "square", .09, 2200);
    nextT += sl; step++;
  }
}
function sfxDeath() { if (!ac || muted) return; const t = ac.currentTime; noise(t, .4, .6, 300);
  const o = ac.createOscillator(), g = ac.createGain(); o.type = "sawtooth"; o.frequency.setValueAtTime(260, t); o.frequency.exponentialRampToValueAtTime(30, t + .5);
  g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.001, t + .55); o.connect(g); g.connect(master); o.start(t); o.stop(t + .6); }
function sfxWin() { if (!ac || muted) return; [0, 4, 7, 12].forEach((n, i) => tone(330 * Math.pow(2, n / 12), ac.currentTime + i * .1, .5, "square", .2, 3000)); }

// ---------- Game state ----------
let state = "menu", hold = false, attempts = 1, best = +(lsGet("nw_best") || 0);
let px, py, grace = 0, trail, parts, shake = 0, flash = 0, deadT = 0, tt = 0, camX = 0, glitch = 0, lastPct = 0;
const rain = Array.from({ length: 110 }, () => ({ x: Math.random(), y: Math.random(), l: 10 + Math.random() * 18, s: .7 + Math.random() * .8 }));

function reset() { px = 0; py = at(cen, 0); grace = 0.6; trail = []; parts = []; shake = 0; flash = 0; state = "ready"; }
reset(); state = "menu";

function press() {
  hold = true; audioInit();
  if (state === "win") reset();
  if (state === "menu" || state === "ready") state = "play";
}
function release() { hold = false; }
addEventListener("keydown", e => {
  if (e.code === "KeyM") { muted = !muted; return; }
  if (["Space", "ArrowUp", "KeyW"].includes(e.code)) { e.preventDefault(); if (!e.repeat) press(); }
});
addEventListener("keyup", e => { if (["Space", "ArrowUp", "KeyW"].includes(e.code)) release(); });
cv.addEventListener("mousedown", press); addEventListener("mouseup", release);
cv.addEventListener("touchstart", e => { e.preventDefault(); press(); }, { passive: false });
cv.addEventListener("touchend", e => { e.preventDefault(); release(); }, { passive: false });

function burst(x, y, n, spd, life) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.3, v = Math.random() * spd;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (.5 + Math.random() * .5), max: life, c: PAL[Math.floor(Math.random() * 3)] }); }
}
function die() {
  state = "dead"; deadT = 0; shake = 14; flash = 1; glitch = .5; attempts++;
  lastPct = Math.floor(px / L * 100); if (lastPct > best) { best = lastPct; lsSet("nw_best", best); }
  burst(px, py, 90, 520, 1.1); sfxDeath();
}

function update(dt) {
  tt += dt;
  if (state === "play") {
    const sp = SPEED0 + 100 * (px / L);
    px += sp * dt;
    if (grace > 0) grace -= dt; else py += (hold ? -1 : 1) * sp * dt;   // short hover at the start
    trail.push({ x: px, y: py }); while (trail.length && trail[0].x < px - 300) trail.shift();
    if (Math.random() < .8) parts.push({ x: px - 6, y: py, vx: -120 - Math.random() * 100, vy: (Math.random() - .5) * 80, life: .4, max: .4, c: PAL[Math.floor(Math.random() * 2)] });
    const r = 4 * WAVE + 1, c = ceilY(px) + 4, f = floorY(px) - 4;
    let hit = py - r < c || py + r > f;
    obs.forEach(o => {
      if (px + r > o.x - o.w / 2 && px - r < o.x + o.w / 2) {
        if (o.top && py - r < ceilY(o.x) + o.h + 4) hit = true;
        if (!o.top && py + r > floorY(o.x) - o.h - 4) hit = true;
      }
    });
    if (hit) die();
    else if (px >= L) { state = "win"; lastPct = 100; best = 100; lsSet("nw_best", 100); flash = 1; glitch = .6; burst(px, py, 120, 600, 1.4); sfxWin(); }
  } else if (state === "dead") {
    deadT += dt; if (deadT > 1) { reset(); if (hold) state = "play"; }
  } else if (state === "menu" || state === "ready") { px = 0; py = at(cen, 0) + Math.sin(tt * 4) * 30; }
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; });
  parts = parts.filter(p => p.life > 0);
  shake *= Math.pow(.02, dt); flash = Math.max(0, flash - dt * 2.5); glitch = Math.max(0, glitch - dt);
}

// ---------- Rendering ----------
const glow = (c, b) => { ctx.shadowColor = c; ctx.shadowBlur = b * S; };
const noGlow = () => { ctx.shadowBlur = 0; };

function glitchText(str, x, y, size, col, align = "center") {
  ctx.font = font(size); ctx.textAlign = align;
  const j = glitch > 0 || Math.random() < .03 ? (Math.random() - .5) * 8 : 0;
  ctx.fillStyle = "rgba(255,0,90,.85)"; ctx.fillText(str, x - 3 + j, y);
  ctx.fillStyle = "rgba(0,240,255,.85)"; ctx.fillText(str, x + 3 - j, y);
  glow(col, 18); ctx.fillStyle = "#fff"; ctx.fillText(str, x, y); noGlow();
}

function drawBackground(hue) {
  let g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#05000f"); g.addColorStop(.55, "#1d0540"); g.addColorStop(1, "#4a0a55");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = .9; ctx.drawImage(sunC, W * .66 - 170, 40, 340, 340); ctx.globalAlpha = 1;
  [[layers[0], .12], [layers[1], .3]].forEach(([l, f]) => {
    const off = -((camX * f) % TILE); ctx.drawImage(l, off, 0, TILE, H); ctx.drawImage(l, off + TILE, 0, TILE, H);
  });
  // perspective grid
  ctx.save(); ctx.strokeStyle = `hsla(${hue},100%,60%,.22)`; ctx.lineWidth = 1;
  const hy = H * .72; ctx.beginPath();
  for (let i = -12; i <= 12; i++) { ctx.moveTo(W / 2 + i * 14, hy); ctx.lineTo(W / 2 + i * 150, H); }
  const o = (camX * .01) % 1;
  for (let i = 0; i < 10; i++) { const t = (i + o) / 10, y = hy + (H - hy) * t * t; ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke(); ctx.restore();
  ctx.fillStyle = `hsla(${hue},100%,50%,.07)`; ctx.fillRect(0, 0, W, H);
  // rain
  ctx.strokeStyle = "rgba(120,220,255,.28)"; ctx.lineWidth = 1; ctx.beginPath();
  rain.forEach(r => { r.y += r.s * .012; r.x -= r.s * .002; if (r.y > 1) { r.y = 0; r.x = Math.random() * 1.2; } if (r.x < 0) r.x += 1.2;
    const x = r.x * W, y = r.y * H; ctx.moveTo(x, y); ctx.lineTo(x - 3, y + r.l); });
  ctx.stroke();
}

function drawWorld(hue) {
  const x0 = camX - 12, x1 = camX + W + 12, i0 = Math.max(0, Math.floor(x0 / STEP)), i1 = Math.min(N - 1, Math.ceil(x1 / STEP));
  const col = `hsl(${hue},100%,60%)`;
  // walls
  for (const top of [true, false]) {
    ctx.beginPath(); const edge = top ? -200 : H + 200;
    ctx.moveTo(i0 * STEP, edge);
    for (let i = i0; i <= i1; i++) ctx.lineTo(i * STEP, top ? cen[i] - gp[i] / 2 : cen[i] + gp[i] / 2);
    ctx.lineTo(i1 * STEP, edge); ctx.closePath();
    ctx.fillStyle = "#07000f"; ctx.fill();
    ctx.save(); ctx.clip();                              // circuit stripes inside the wall
    ctx.strokeStyle = `hsla(${hue},100%,60%,.10)`; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = Math.floor(x0 / 60) * 60; x < x1; x += 60) { ctx.moveTo(x, -200); ctx.lineTo(x, H + 200); }
    ctx.stroke(); ctx.restore();
    // neon edge + echoes
    [[0, 1, 3], [10, .25, 1.5], [22, .1, 1.5]].forEach(([d, a, w]) => {
      ctx.beginPath();
      for (let i = i0; i <= i1; i++) { const y = top ? cen[i] - gp[i] / 2 - d : cen[i] + gp[i] / 2 + d; i === i0 ? ctx.moveTo(i * STEP, y) : ctx.lineTo(i * STEP, y); }
      ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = w; if (d === 0) glow(col, 22); ctx.stroke(); noGlow(); ctx.globalAlpha = 1;
    });
    // teeth
    ctx.beginPath(); const dir = top ? 1 : -1;
    for (let x = Math.floor(x0 / 18) * 18; x < x1; x += 18) {
      const ya = top ? ceilY(x) : floorY(x), yb = top ? ceilY(x + 18) : floorY(x + 18), ym = top ? ceilY(x + 9) : floorY(x + 9);
      ctx.moveTo(x, ya); ctx.lineTo(x + 18, yb); ctx.lineTo(x + 9, ym + dir * 9); ctx.closePath();
    }
    ctx.fillStyle = col; ctx.globalAlpha = .85; ctx.fill(); ctx.globalAlpha = 1;
  }
  // obstacles
  obs.forEach(o => {
    if (o.x < x0 - 40 || o.x > x1 + 40) return;
    const y = o.top ? ceilY(o.x) : floorY(o.x), by = o.top ? y + o.h : y - o.h, a = o.top ? y - 60 : by;
    ctx.fillStyle = "#12002a"; ctx.fillRect(o.x - o.w / 2, a, o.w, o.top ? by - a : y + 60 - by);
    ctx.strokeStyle = "#ff2bd6"; ctx.lineWidth = 3; glow("#ff2bd6", 20); ctx.strokeRect(o.x - o.w / 2, a, o.w, o.top ? by - a : y + 60 - by); noGlow();
    ctx.fillStyle = "#ff2bd6"; ctx.beginPath(); const d = o.top ? 1 : -1;
    for (let k = 0; k < 2; k++) { const sx = o.x - o.w / 2 + k * o.w / 2; ctx.moveTo(sx, by); ctx.lineTo(sx + o.w / 2, by); ctx.lineTo(sx + o.w / 4, by + d * 11); ctx.closePath(); }
    ctx.fill();
  });
  // particles
  parts.forEach(p => { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); });
  ctx.globalAlpha = 1;
  // trail
  if (trail.length > 1 && state !== "dead") {
    [[12, .22, "#ff2bd6"], [5, .9, "#00f0ff"], [2, 1, "#ffffff"]].forEach(([w, a, c]) => {
      ctx.beginPath(); trail.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      ctx.lineWidth = w * WAVE; ctx.globalAlpha = a; ctx.strokeStyle = c; ctx.lineJoin = "round"; if (w === 5) glow("#00f0ff", 18); ctx.stroke(); noGlow();
    }); ctx.globalAlpha = 1;
  }
  // wave
  if (state !== "dead") {
    const ang = state === "play" || state === "ready" || state === "menu" ? (hold ? -Math.PI / 4 : Math.PI / 4) : 0;
    ctx.save(); ctx.translate(px, py); ctx.rotate(ang); ctx.scale(WAVE, WAVE);
    ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(-9, -9); ctx.lineTo(-4, 0); ctx.lineTo(-9, 9); ctx.closePath();
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#00f0ff"; ctx.lineWidth = 2.5; glow("#00f0ff", 26); ctx.fill(); ctx.stroke(); noGlow(); ctx.restore();
  }
}

function drawHUD() {
  const pct = state === "play" || state === "win" ? Math.min(100, px / L * 100) : 0;
  const bw = Math.min(W * .5, 520), bx = W / 2 - bw / 2;
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(bx, 16, bw, 12);
  ctx.fillStyle = "#00f0ff"; glow("#00f0ff", 14); ctx.fillRect(bx, 16, bw * pct / 100, 12); noGlow();
  ctx.strokeStyle = "#ff2bd6"; ctx.lineWidth = 2; ctx.strokeRect(bx, 16, bw, 12);
  ctx.font = font(15); ctx.textAlign = "center"; ctx.fillStyle = "#fff"; glow("#00f0ff", 10); ctx.fillText(Math.floor(pct) + "%", W / 2, 52);
  ctx.textAlign = "left"; ctx.fillStyle = "#ff2bd6"; glow("#ff2bd6", 10); ctx.fillText("ATTEMPT " + attempts, 18, 34);
  ctx.textAlign = "right"; ctx.fillStyle = "#ffe14d"; glow("#ffe14d", 10); ctx.fillText("BEST " + best + "%", W - 18, 34); noGlow();
  ctx.font = font(11); ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.fillText("[M] " + (muted ? "SOUND OFF" : "SOUND ON"), W - 18, 54);

  const cx = W / 2;
  if (state === "menu") {
    ctx.fillStyle = "rgba(5,0,15,.55)"; ctx.fillRect(0, 0, W, H);
    glitchText("NEON WAVE", cx, 250, 64, "#ff2bd6");
    ctx.font = font(15); ctx.textAlign = "center"; ctx.fillStyle = "#00f0ff"; glow("#00f0ff", 10);
    ctx.fillText("// CYBERPUNK WAVE DASH //", cx, 288);
    ctx.fillStyle = Math.floor(tt * 2) % 2 ? "#fff" : "#ffe14d"; ctx.fillText("HOLD  SPACE / CLICK / TOUCH  TO START", cx, 350);
    ctx.font = font(12); ctx.fillStyle = "rgba(255,255,255,.7)"; noGlow();
    ctx.fillText("HOLD = RISE    RELEASE = DIVE    DON'T TOUCH THE NEON", cx, 380);
  }
  if (state === "ready" && attempts > 1) {
    ctx.font = font(18); ctx.textAlign = "center"; ctx.fillStyle = Math.floor(tt * 3) % 2 ? "#fff" : "#00f0ff"; glow("#00f0ff", 12);
    ctx.fillText("HOLD TO RETRY", cx, H - 60); noGlow();
  }
  if (state === "dead") {
    ctx.fillStyle = `rgba(30,0,20,${Math.min(.6, deadT)})`; ctx.fillRect(0, 0, W, H);
    glitchText("SYSTEM FAILURE", cx, 280, 46, "#ff2a5a");
    ctx.font = font(18); ctx.textAlign = "center"; ctx.fillStyle = "#ffe14d"; glow("#ffe14d", 10); ctx.fillText("CRASHED AT " + lastPct + "%", cx, 322); noGlow();
  }
  if (state === "win") {
    ctx.fillStyle = "rgba(5,0,25,.55)"; ctx.fillRect(0, 0, W, H);
    glitchText("LEVEL COMPLETE", cx, 270, 48, "#00f0ff");
    ctx.font = font(18); ctx.textAlign = "center"; ctx.fillStyle = "#ffe14d"; glow("#ffe14d", 10);
    ctx.fillText("SYSTEM HACKED  -  " + (attempts - 1 + 1) + " ATTEMPTS", cx, 315);
    ctx.fillStyle = Math.floor(tt * 2) % 2 ? "#fff" : "#ff2bd6"; ctx.fillText("HOLD TO PLAY AGAIN", cx, 360); noGlow();
  }
}

function render() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  camX = px - W * .28;
  const hue = 190 + Math.min(1, px / L) * 140;
  const sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake;
  ctx.save(); ctx.translate(sx, sy);
  drawBackground(hue);
  ctx.save(); ctx.translate(-camX, 0); drawWorld(hue); ctx.restore();
  ctx.restore();
  ctx.fillStyle = ctx.createPattern(scanC, "repeat"); ctx.save(); ctx.scale(1 / S * 1, 1 / S * 1); ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore();
  ctx.drawImage(vigC, 0, 0, W, H);
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * .6})`; ctx.fillRect(0, 0, W, H); }
  drawHUD();
  if (glitch > 0) {                                      // glitch slices
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (let i = 0; i < 6; i++) { const y = Math.random() * cv.height, h = 10 + Math.random() * 50, o = (Math.random() - .5) * 60 * glitch * 2;
      ctx.drawImage(cv, 0, y, cv.width, h, o, y, cv.width, h); }
  }
}

let last = 0;
function loop(ms) {
  requestAnimationFrame(loop);
  const dt = Math.min(1 / 30, (ms - last) / 1000 || 0); last = ms;
  update(dt); render();
}
requestAnimationFrame(loop);
</script>
</body>
